<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" role="img" aria-label="Nazar">
  <title>Nazar</title>
  <!--
    The mark, and the favicon. Direction 04 from docs/design/README.md: the bead
    authored on the 16x16 grid the tray actually uses, so every cell is a whole
    unit and at 16 px each rect lands on exactly one device pixel.

    Geometry identical to docs/design/icon-04-pixel-bead.svg, which stays the
    master; packages/ui/test/bead.test.ts compares the two cell by cell, and
    compares both against the grid in src/bead.ts that the page, the boot page
    and the tray rasteriser all draw from. Only the width and height differ:
    32 CSS px is what a favicon is asked for, and it is 16 doubled, so the
    cells stay square.
  -->
