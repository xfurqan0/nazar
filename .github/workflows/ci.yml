name: CI

on:
  push:
    branches: [main]
    # A release tag runs the whole file, which is what makes the `bundle` job's
    # condition below reachable: it is the one job nobody wants on every push, and a
    # tag is the moment its three artifacts are actually needed.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Build first: the type-check and the tests both resolve @nazar/core
      # through the workspace link, which points at its build output.
      - name: Build
        run: npm run build

      - name: Lint (type-check)
        run: npm run typecheck

      - name: Test
        run: npm test

  # The "fresh machine" acceptance from docs/PROJECT.md WP6, on all three
  # platforms: pack the tarball, install it into an empty directory with a cold
  # npm cache, drive the installed binary through --version, --help, npx and
  # doctor, then start it on a free port and read /api/state. It publishes
  # nothing and touches nothing under ~/.claude.
  pack:
    name: pack smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # A cold cache is the point: the smoke has to prove the tarball carries
      # everything it needs, not that this runner kept a copy of something.
      - name: Clean the npm cache
        run: npm cache clean --force

      # `npm run smoke` packs (prepack builds first), installs and runs.
      - name: Pack, install and run
        run: npm run smoke

  # WP8. The pure half of the desktop shell — the Node version check, the parent-chain
  # walk and the window ranking — has no Tauri in it and no platform API, so it compiles
  # and tests on all three systems from the first commit. That is what makes the macOS and
  # Linux ports of the jump ladder a step rather than a rewrite, and it is checked now
  # rather than on the day somebody attempts one.
  #
  # N-WP-L9 added a fourth entry, and the cheapest possible place to ask the question:
  # `ubuntu-24.04-arm` is a GitHub-hosted arm64 runner, free on public repositories, and
  # this job needs a toolchain and nothing else. An architecture nobody compiles for is an
  # architecture nobody knows about.
  shell-core:
    name: shell logic / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: shell-core-${{ matrix.os }}

      # `-p nazar-shell` and not `--workspace`: the desktop crate needs WebView2 on
      # Windows and a GTK/WebKit stack elsewhere, and none of that is required to check
      # whether the ranking picks the right window.
      - name: Test the pure crate
        run: cargo test -p nazar-shell

  # The gate for the shell itself. Everything that decides whether a change is correct
  # lives here, and none of it needs the bundler: risk R1 in nazar-tray's plan, which
  # applies unchanged — the Tauri bundler is the fragile part of a Windows pipeline
  # (WebView2, NSIS, signing), and a bundler problem must never be able to make a correct
  # change look broken.
  desktop:
    name: desktop shell — lint, test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # `bundle.resources` names `resources/server`, and `tauri-build` checks that the
      # path exists while the crate *compiles* — so the package has to be built and staged
      # before clippy or cargo test can expand `generate_context!`, not merely before the
      # bundler runs.
      - name: Build and stage the package
        run: node scripts/build-desktop.mjs --stage

      - name: Check dependency licences
        run: node scripts/check-licenses.mjs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The two live jump tests read the runner's own desktop. A windows-latest image
      # does run a Windows Terminal window, but UI Automation on it answers with no
      # tabs — an environment the shipped code never sees. The gate turns those two
      # into skips; every rule they sit next to still runs on made-up data.
      - name: Test the Rust workspace
        run: cargo test --workspace
        env:
          NAZAR_TEST_NO_LIVE: "1"

  # N-WP-L3 and N-WP-L4. The same lints and a real link, on Linux, on every push.
  #
  # **Why this is a second job and not a matrix entry on `desktop`.** That job runs
  # `cargo test --workspace`, and the tests it is there for read a Windows desktop —
  # UI Automation, the window list, the jump. A matrix would have to switch half its own
  # steps off, and the Windows gate is the one thing in this file that must not become
  # harder to read.
  #
  # **Why it was worth adding.** `node.rs` carried a `let mut` that only Windows mutates,
  # so every Linux and macOS build warned about it — and nobody ever saw the warning,
  # because clippy ran on `windows-latest` alone. A lint that only one platform is held to
  # is a lint the other two are not held to, and this repository compiles on three.
  #
  # The GTK and WebKit stack is installed because clippy *compiles* the desktop crate:
  # `generate_context!` expands against a staged bundle, and `tauri-build` checks the
  # resource path exists while the crate builds.
  desktop-linux:
    name: desktop shell — lint, build, test (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux

      # The same list the `bundle` job installs, minus `patchelf`, which only the AppImage
      # bundler needs and nothing here bundles.
      - name: Install the GTK and WebKit stack
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and stage the package
        run: node scripts/build-desktop.mjs --stage

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # N-WP-L4. Clippy is a check, not a link: it never asks the linker whether the GTK,
      # WebKit and AppIndicator symbols it needs are actually there. Until now the only
      # thing that did on Linux was the `bundle` job, which runs on a tag — so a Linux
      # link regression had until a release to be noticed, and would then be noticed
      # during one. The debug profile because the point is the answer and not the binary;
      # a release build would cost the job ten minutes for nothing anybody downloads.
      #
      # It costs almost nothing after the first run: this is the same job, so the cache
      # above already holds the dependency graph clippy compiled a step earlier.
      - name: Build the shell
        run: cargo build -p nazar-desktop

      # N-WP-L7. The shell's Linux-only behaviour had no test job anywhere: the suite runs
      # on `windows-latest`, where the process group, `PR_SET_PDEATHSIG` and the display
      # server the canvas is told about are all compiled out. Tests written on a Fedora
      # laptop for N-WP-L2 and N-WP-L7 were therefore run by nobody but their author,
      # which is the same hole this job was made to close one lint earlier.
      #
      # `-p nazar-desktop` rather than `--workspace`: `nazar-shell` already has a job on
      # all three systems, and running it twice here would only make this one slower.
      # Nothing in it reads a desktop — the live jump tests are Windows-only — so there is
      # no gate to switch off on a runner with no session bus.
      - name: Test the shell
        run: cargo test -p nazar-desktop

  # N-WP-L9. The same shell, linked and tested one architecture over.
  #
  # **Why a second job and not a matrix entry on `desktop-linux`.** That job is the Linux
  # *gate*, and half of what it runs — `cargo fmt`, `cargo clippy --workspace` — has no
  # architecture in it: there is not a single `cfg(target_arch)` in this tree, so a second
  # clippy would buy nothing and cost every push the minutes it takes. What an arm64
  # runner buys is the two things a check cannot fake: a link against another ABI's GTK,
  # WebKit and AppIndicator, and the `libc` calls in `server.rs` — process groups,
  # `PR_SET_PDEATHSIG`, the signal numbers — running on the architecture whose constants
  # they were compiled against.
  #
  # **Why `ubuntu-24.04-arm` and not `-22.04-arm`**, when the bundle below insists on the
  # older image: this job answers whether the code is right and ships nothing, and only a
  # file somebody downloads has a glibc floor to keep.
  desktop-linux-arm:
    name: desktop shell — build, test (linux arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux-arm

      # The same list as the x86-64 job above; Ubuntu carries every one of these for
      # arm64, which is the short answer to whether this port is a port at all.
      - name: Install the GTK and WebKit stack
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and stage the package
        run: node scripts/build-desktop.mjs --stage

      - name: Build the shell
        run: cargo build -p nazar-desktop

      - name: Test the shell
        run: cargo test -p nazar-desktop

  # A separate job, and it may fail without hiding a real regression. It uploads the
  # installer; it does not decide whether the change was right.
  installer:
    name: desktop shell — installer
    runs-on: windows-latest
    needs: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: installer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # `--debug` keeps a pull request's feedback in minutes rather than tens of minutes;
      # the release build runs the same script without it. The NSIS toolchain is
      # downloaded by the Tauri bundler on first use.
      - name: Build the installer
        run: node scripts/build-desktop.mjs --debug

      # N-WP-L8. The debug binary is remapped like the release one now — this artifact is
      # downloadable by anyone reading the repository, and it used to carry one path per
      # panic site. The executable is what is scanned: an NSIS installer compresses its
      # payload with LZMA and nothing here unpacks that, so the file inside it is checked
      # as itself rather than through a container the check cannot read.
      - name: Check the executable for build-machine paths
        run: node scripts/check-binary-paths.mjs target/debug/nazar-desktop.exe

      - uses: actions/upload-artifact@v4
        with:
          name: nazar-desktop-debug-windows
          path: |
            target/debug/nazar-desktop.exe
            target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # N-WP19a. The macOS and Linux bundles — and the only jobs in this file that do not run
  # on a push or a pull request.
  #
  # **Why they are gated.** A macOS runner is billed at ten times a Linux one, these are
  # release builds rather than the `--debug` the Windows installer job uses, and none of
  # the three artifacts decides whether a change is *correct*: `shell-core` already
  # compiles and tests the pure crate on all three systems on every push, and `desktop`
  # is the gate. So they are asked for by hand — `gh workflow run ci.yml --ref <branch>` —
  # or by a `v*` tag, which is when a release actually needs them.
  #
  # **No `needs:`.** The Windows `installer` waits for `desktop` because the two share a
  # machine's worth of the same compilation; these three do not, and making a macOS job
  # queue behind a Windows one would only add a quarter of an hour to something a person
  # is standing there waiting for.
  #
  # **Unsigned, and deliberately** (`docs/PLATFORMS.md`). The `.dmg` is ad-hoc signed —
  # `bundle.macOS.signingIdentity: "-"` — so it runs after the quarantine flag is cleared
  # and not before; notarisation costs $99 a year and is a decision for a download count
  # that does not exist yet. Nothing here reads a secret, which is also why these jobs are
  # safe to run from a branch.
  bundle:
    name: desktop bundle / ${{ matrix.label }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon is the host architecture of `macos-latest`; the Intel bundle is
          # a cross-compile from the same runner, which is why both are one `include`
          # entry each rather than a second operating system.
          - os: macos-latest
            label: macos
            arch: arm64
            target: aarch64-apple-darwin
            bundles: app dmg
            artifacts: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-latest
            label: macos
            arch: x64
            target: x86_64-apple-darwin
            bundles: app dmg
            artifacts: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          # `ubuntu-22.04` and not `ubuntu-latest`, and the reason is the one number a
          # Linux binary cannot argue with. A release built on 24.04 records
          # `GLIBC_2.39` against symbols glibc only grew in 2.39, and a machine with an
          # older libc then refuses to start it: *version `GLIBC_2.39' not found*,
          # measured by installing a locally built `.deb` into a Debian 12 container
          # (N-WP-L8). Debian 12 carries 2.36 and Ubuntu 22.04 carries 2.35, so building
          # on the oldest supported runner is what makes the bundle run on the widest
          # range of machines — glibc is backwards compatible, never forwards.
          - os: ubuntu-22.04
            label: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage deb
            artifacts: |
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          # N-WP-L9. The same image one architecture over, on a GitHub-hosted arm64
          # runner — free on public repositories — and natively, which is why there is no
          # cross-compilation apparatus anywhere in this file: a GTK and WebKit sysroot
          # for a second architecture is a larger thing to keep working than a runner
          # that already has one. `ubuntu-22.04-arm` and not the newer image for the
          # glibc reason directly above; an arm64 machine running Debian 12 is as common
          # as an x86-64 one, and the floor is a property of the runner either way.
          - os: ubuntu-22.04-arm
            label: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            bundles: appimage deb
            artifacts: |
              target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.label }}-${{ matrix.arch }}

      # The Tauri v2 prerequisites for Debian and Ubuntu, plus `patchelf`, which the
      # AppImage bundler uses to rewrite the interpreter path of the binary it packs.
      # `libayatana-appindicator3-dev` and not `libappindicator3-dev`: the tray is the
      # reason either is here, and on 24.04 the second is a transitional package for the
      # first.
      - name: Install the GTK and WebKit stack
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Separate from the bundler step, and `--skip-npm-build` below because of it: when
      # this fails it is the package that is broken, not the platform, and a job summary
      # that says which of the two it was is worth one extra line here.
      - name: Build
        run: npm run build

      # `cargo-tauri`. Upstream publishes a prebuilt binary for five targets and
      # `aarch64-unknown-linux-gnu` is not one of them, so on that runner the action falls
      # through to cargo-binstall and cargo-binstall falls through to compiling the CLI —
      # minutes this job pays on a tag and nothing pays on a push. Pinning a different
      # installer per architecture would hide that behind two ways of doing one thing.
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # The bundle kinds are passed on the command line rather than left to the config so
      # that this matrix is the single place that says what each runner produces. The
      # script writes the file names and their sizes to the job summary.
      - name: Bundle
        run: node scripts/build-desktop.mjs --skip-npm-build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # N-WP-L8. The one check in this file that reads the artifact instead of the tree.
      # `docs/RELEASE.md` greps the working directory for an account name and can never
      # see the ones that matter: every panic site carries the source path it was compiled
      # from as a string literal, `strip` does not touch those, and a sibling project
      # shipped 182 copies of a developer's home directory in one installer before anybody
      # looked inside one. `build-desktop.mjs` remaps them away; this is what says so.
      - name: Check the bundles for build-machine paths
        run: node scripts/check-binary-paths.mjs target/${{ matrix.target }}/release/nazar-desktop target/${{ matrix.target }}/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nazar-desktop-${{ matrix.label }}-${{ matrix.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
